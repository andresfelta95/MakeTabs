server {
    listen 80;

    # Docker's embedded DNS. Re-resolve the backend every 10s instead of once at
    # startup: when maketabs-backend is recreated it gets a new IP, and a cached
    # one makes every /api request (including Spotify login) a 502 until this
    # container restarts. Using a variable in proxy_pass is what forces this.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://maketabs-backend:8000;
    root /usr/share/nginx/html;
    index index.html;

    # All backend traffic lives under /api — the rewrite strips the prefix, so
    # /api/tabs/history hits the backend as /tabs/history (query string kept).
    # This keeps SPA page routes (/tabs, /16bit, /chiptune/:id) from colliding
    # with API paths.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Kept at the root for uptime monitors
    location = /health {
        proxy_pass $backend;
    }

    # React SPA — serve index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
